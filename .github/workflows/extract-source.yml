
name: Extract Sri Bairavar Source Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source files
        run: |
          mkdir -p /tmp/sri-source
          unzip -q SriBairavar_Source_Android.zip -d /tmp/sri-source

          SOURCE_DIR=$(find /tmp/sri-source -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$SOURCE_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi

          cp -a "$SOURCE_DIR"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Phase 1 source code"
            git push
          fi
          
